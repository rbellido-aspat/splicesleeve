<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-labelledby="t d" font-family="Lato, Calibri, Arial, sans-serif">
  <title id="t">Cotas del manguito NMB Splice Sleeve UX(SA)</title>
  <desc id="d">Vista longitudinal del manguito con extremo ancho a la izquierda y extremo angosto a la derecha, puertos de inyección y salida, tope de barra, guía de barra, sello de 15 mm y cortes transversales en el centro y en la guía de barra.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#13315c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="470" fill="#ffffff"/>

  <!-- Eje -->
  <line x1="70" y1="220" x2="880" y2="220" stroke="#8da9c4" stroke-width="1.5" stroke-dasharray="22 6 4 6"/>

  <!-- Puertos (sobre el cuerpo) -->
  <rect x="167" y="128" width="26" height="34" fill="#c9d2dc" stroke="#22303f" stroke-width="2"/>
  <rect x="707" y="128" width="26" height="34" fill="#c9d2dc" stroke="#22303f" stroke-width="2"/>

  <!-- Cuerpo del manguito -->
  <rect x="100" y="160" width="700" height="120" rx="10" fill="#c9d2dc" stroke="#22303f" stroke-width="2.5"/>

  <!-- Cavidad extremo ancho (B) -->
  <rect x="100" y="180" width="340" height="80" fill="#ffffff" stroke="#22303f" stroke-width="1.5"/>
  <!-- Cavidad extremo angosto (b) -->
  <rect x="460" y="192" width="330" height="56" fill="#ffffff" stroke="#22303f" stroke-width="1.5"/>
  <!-- Paso entre cavidades -->
  <rect x="440" y="200" width="20" height="40" fill="#ffffff" stroke="#22303f" stroke-width="1.5"/>

  <!-- Resaltes anulares internos, extremo ancho -->
  <g fill="#9fb0c2" stroke="#22303f" stroke-width="1">
    <rect x="130" y="180" width="14" height="8"/><rect x="130" y="252" width="14" height="8"/>
    <rect x="185" y="180" width="14" height="8"/><rect x="185" y="252" width="14" height="8"/>
    <rect x="240" y="180" width="14" height="8"/><rect x="240" y="252" width="14" height="8"/>
    <rect x="295" y="180" width="14" height="8"/><rect x="295" y="252" width="14" height="8"/>
    <rect x="350" y="180" width="14" height="8"/><rect x="350" y="252" width="14" height="8"/>
    <rect x="405" y="180" width="14" height="8"/><rect x="405" y="252" width="14" height="8"/>
  </g>
  <!-- Resaltes anulares internos, extremo angosto -->
  <g fill="#9fb0c2" stroke="#22303f" stroke-width="1">
    <rect x="620" y="192" width="14" height="7"/><rect x="620" y="241" width="14" height="7"/>
    <rect x="670" y="192" width="14" height="7"/><rect x="670" y="241" width="14" height="7"/>
    <rect x="720" y="192" width="14" height="7"/><rect x="720" y="241" width="14" height="7"/>
    <rect x="765" y="192" width="14" height="7"/><rect x="765" y="241" width="14" height="7"/>
  </g>

  <!-- Tope de barra -->
  <circle cx="450" cy="220" r="9" fill="#ffffff" stroke="#c8102e" stroke-width="2.5"/>
  <line x1="450" y1="160" x2="450" y2="280" stroke="#c8102e" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Guía de barra -->
  <g stroke="#22303f" stroke-width="2" fill="#9fb0c2">
    <path d="M520 192 L560 204 L520 204 z"/>
    <path d="M520 248 L560 236 L520 236 z"/>
  </g>

  <!-- Sello de 15 mm en el extremo angosto -->
  <rect x="800" y="172" width="16" height="96" rx="4" fill="#5d6f82" stroke="#22303f" stroke-width="2"/>

  <!-- Rótulos de componentes -->
  <g font-size="15" fill="#22303f">
    <text x="345" y="122" text-anchor="middle">Tope de barra</text>
    <line x1="395" y1="128" x2="446" y2="208" stroke="#22303f" stroke-width="1.2"/>
    <text x="590" y="122" text-anchor="middle">Guía de barra</text>
    <line x1="580" y1="128" x2="545" y2="200" stroke="#22303f" stroke-width="1.2"/>
    <text x="180" y="122" text-anchor="middle" font-weight="700">ϕ26</text>
    <text x="720" y="122" text-anchor="middle" font-weight="700">ϕ26</text>
    <text x="860" y="312" text-anchor="middle">sello 15 mm</text>
    <line x1="840" y1="298" x2="814" y2="270" stroke="#22303f" stroke-width="1.2"/>
    <text x="230" y="230" text-anchor="middle" fill="#4a5563">extremo ancho</text>
    <text x="680" y="230" text-anchor="middle" fill="#4a5563">extremo angosto</text>
  </g>

  <!-- Cotas superiores -->
  <g stroke="#13315c" stroke-width="1.5" fill="none">
    <line x1="100" y1="58" x2="720" y2="58" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="100" y1="92" x2="180" y2="92" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="450" y1="92" x2="800" y2="92" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="100" y1="44" x2="100" y2="158" stroke-dasharray="3 3"/>
    <line x1="720" y1="44" x2="720" y2="126" stroke-dasharray="3 3"/>
    <line x1="180" y1="80" x2="180" y2="104" stroke-dasharray="3 3"/>
    <line x1="800" y1="80" x2="800" y2="158" stroke-dasharray="3 3"/>
  </g>
  <g font-size="18" font-weight="700" fill="#13315c" text-anchor="middle">
    <text x="410" y="50">D</text>
    <text x="140" y="84">C</text>
    <text x="625" y="84">E</text>
  </g>

  <!-- Cotas inferiores -->
  <g stroke="#13315c" stroke-width="1.5" fill="none">
    <line x1="100" y1="332" x2="450" y2="332" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="450" y1="332" x2="790" y2="332" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="100" y1="378" x2="800" y2="378" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="100" y1="282" x2="100" y2="392" stroke-dasharray="3 3"/>
    <line x1="450" y1="282" x2="450" y2="346" stroke-dasharray="3 3"/>
    <line x1="790" y1="250" x2="790" y2="346" stroke-dasharray="3 3"/>
    <line x1="800" y1="282" x2="800" y2="392" stroke-dasharray="3 3"/>
  </g>
  <g font-size="18" font-weight="700" fill="#13315c" text-anchor="middle">
    <text x="275" y="324">F1</text>
    <text x="620" y="324">F2</text>
  </g>
  <text x="450" y="404" font-size="16" fill="#13315c" text-anchor="middle">Largo del manguito</text>

  <!-- Diámetros -->
  <g stroke="#13315c" stroke-width="1.5" fill="none">
    <line x1="52" y1="160" x2="52" y2="280" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="78" y1="180" x2="78" y2="260" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="40" y1="160" x2="98" y2="160" stroke-dasharray="3 3"/>
    <line x1="40" y1="280" x2="98" y2="280" stroke-dasharray="3 3"/>
    <line x1="840" y1="192" x2="840" y2="248" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="870" y1="160" x2="870" y2="280" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="818" y1="160" x2="882" y2="160" stroke-dasharray="3 3"/>
    <line x1="818" y1="280" x2="882" y2="280" stroke-dasharray="3 3"/>
  </g>
  <g font-size="18" font-weight="700" fill="#13315c" text-anchor="middle">
    <text x="34" y="226">A</text>
    <text x="64" y="226">B</text>
    <text x="828" y="226">b</text>
    <text x="890" y="226">a</text>
  </g>

  <!-- Cortes transversales -->
  <text x="1080" y="78" font-size="17" font-weight="700" fill="#22303f" text-anchor="middle">Sección transversal</text>
  <g stroke="#22303f" stroke-width="2.5">
    <circle cx="1005" cy="220" r="62" fill="#c9d2dc"/>
    <circle cx="1005" cy="220" r="40" fill="#ffffff"/>
    <rect x="963" y="212" width="16" height="16" fill="#c9d2dc" stroke-width="2"/>
    <circle cx="1160" cy="220" r="62" fill="#c9d2dc"/>
    <circle cx="1160" cy="220" r="40" fill="#ffffff"/>
  </g>
  <g fill="#c9d2dc" stroke="#22303f" stroke-width="2">
    <rect x="1153" y="180" width="14" height="16"/>
    <rect x="1153" y="244" width="14" height="16"/>
    <rect x="1120" y="213" width="16" height="14"/>
    <rect x="1184" y="213" width="16" height="14"/>
  </g>
  <g font-size="15" fill="#22303f" text-anchor="middle">
    <text x="1005" y="318">en el centro</text>
    <text x="1160" y="318">en la guía de barra</text>
  </g>

  <text x="620" y="452" font-size="13" fill="#4a5563" text-anchor="middle">Esquema sin escala. Las letras corresponden a las columnas de la tabla de dimensiones.</text>
</svg>
